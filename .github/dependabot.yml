version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Base image tag in .devcontainer/Dockerfile
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: monthly

  # Features pinned in .devcontainer/devcontainer-lock.json
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
