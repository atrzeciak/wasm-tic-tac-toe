name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with .devcontainer/Dockerfile so CI and the devcontainer
  # build with the same toolchain.
  EMSDK_VERSION: "6.0.9"
  BUILD_TYPE: Release

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        # SDL dev packages + ninja: the native build, its unit tests and the
        # compile database clang-tidy reads (see the Makefile's `tidy`).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format clang-tidy shellcheck ninja-build \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev

      - name: clang-format + shellcheck
        run: make lint IN_CONTAINER=1

      - name: clang-tidy
        run: make tidy IN_CONTAINER=1

      - name: Native build + unit tests
        run: make test IN_CONTAINER=1

  build:
    name: Build (wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Restore emsdk
        id: cache-emsdk
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('scripts/install-emscripten.sh') }}

      - name: Install Emscripten
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: EMSDK_DIR="$HOME/emsdk" bash scripts/install-emscripten.sh

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build
        run: make build IN_CONTAINER=1 EMSDK_DIR="$HOME/emsdk" BUILD_TYPE="$BUILD_TYPE"

      - name: Verify site output
        run: |
          for f in dist/index.html dist/index.js dist/index.wasm; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          ls -lh dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Only on merge/push to main - PRs build and lint, but never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
