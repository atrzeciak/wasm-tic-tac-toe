services:
  wasm-tic-tac-toe:
    # Always the Docker engine's own architecture: HOST_PLATFORM comes from
    # .devcontainer/.env, written by host-platform.sh (run by the Makefile and
    # by devcontainer.json's initializeCommand), so an Apple Silicon Mac never
    # ends up under Rosetta, where gdb can't ptrace and everything runs slower.
    # An exported DOCKER_DEFAULT_PLATFORM is not overridden by this line:
    # compose lets it win over `platform:` for builds and refuses when the two
    # differ, so the Makefile unexports it before calling docker.
    # The base image, emsdk and all apt packages ship arm64 too.
    platform: ${HOST_PLATFORM:?run .devcontainer/host-platform.sh first}
    image: local/wasm-tic-tac-toe
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    working_dir: /workarea
    volumes:
      - ..:/workarea:delegated
      # Keep Claude Code login and settings across container rebuilds.
      - claude-config:/home/vscode/.claude
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: /bin/sh -c "while sleep 1000; do :; done"

volumes:
  claude-config:
